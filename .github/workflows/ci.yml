name: CI

# The kit's own gate, the same checks run locally before a commit (see AGENTS.md):
# every script compiles and runs through the wrapper, the skill validates against the
# Agent Skills spec, and the catalog lists only working verbs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:   # the release workflow runs this gate first

permissions:
  contents: read

jobs:
  kit-gate:
    name: Kit gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21 (Error Prone's measure needs it; everything else runs on 17)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Node (for the Agent Skills validator only)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scripts compile and run through the wrapper
        run: |
          ./jbang version
          ./jbang alias list
          for s in scripts/*.java; do ./jbang build "$s"; done
          ./jbang scripts/Assess.java . --quick
          ./jbang scripts/Falsify.java . 2>&1 | grep -q 'name the gate' || (echo "falsify usage message missing" && exit 1)
      - name: Assess fixtures produce the order and states their rules say
        run: |
          fail=0
          for f in fixtures/assess/*/; do
            out=$(./jbang scripts/Assess.java "$f" --quick 2>&1)
            while IFS= read -r l; do
              [ -z "$l" ] && continue
              echo "$out" | grep -qF -- "$l" || { echo "::error::$f: missing: $l"; fail=1; }
            done < "$f/expected-quick.txt"
          done
          out=$(./jbang scripts/Assess.java fixtures/assess/plain 2>&1)
          while IFS= read -r l; do
            [ -z "$l" ] && continue
            echo "$out" | grep -qF -- "$l" || { echo "::error::plain measured: missing: $l"; fail=1; }
          done < fixtures/assess/plain/expected-measured.txt
          exit $fail
      - name: NullAway compiler proof and negative controls
        run: ./jbang tests/NullAwayAdversarialTest.java .
      - name: Falsify restores the target on Ctrl-C and SIGTERM
        run: ./jbang tests/FalsifyInterruptTest.java .
      - name: Plant restoration preserves replacement files and refuses symbolic links
        run: ./jbang tests/PlantOwnershipTest.java .
      - name: PMD ratchet never permits CPD duplication
        run: ./jbang tests/PmdRatchetTest.java .
      - name: Reactor dependencies, module scope and checker isolation
        run: ./jbang tests/ReactorScopeTest.java .
      - name: JaCoCo accounts for every selected module before proposing floors
        run: ./jbang tests/JacocoCompletenessTest.java .
      - name: ArchUnit single-package gates, package cycles and nonempty imports
        run: ./jbang tests/ArchUnitScopeTest.java .
      - name: Assessment resolves test-support scope consistently
        run: ./jbang tests/AssessScopeTest.java .
      - name: Frozen APIs reject compatible and incompatible shape changes
        run: ./jbang tests/ApiFreezeTest.java .
      - name: Maven POM classpaths preserve complete API comparison
        run: ./jbang tests/ApiClasspathTest.java . "${{ runner.temp }}/guardrails-m2"
      - name: Published consumer dependencies reject unrecorded Maven mediation changes
        run: ./jbang tests/ConsumerClosureTest.java . "${{ runner.temp }}/guardrails-m2"
      - name: Findings follow declarations and preserve multiplicity across hotspots
        run: ./jbang tests/FindingRegressionTest.java .
      - name: Coverage floors must remain positive
        run: ./jbang tests/JacocoPositiveFloorTest.java .
      - name: Full pass measurement and missing-report remediation
        run: ./jbang tests/PassMeasurementTest.java . "${{ runner.temp }}/guardrails-m2"
      - name: Enforcement filters cannot hide measured findings
        run: ./jbang tests/MeasurementFilterTest.java . "${{ runner.temp }}/guardrails-m2"
      - name: Descriptor-only modules retain complete shared measurement
        run: ./jbang tests/DescriptorModuleTest.java . "${{ runner.temp }}/guardrails-m2"
      - name: Missing scoped evidence and changed multiplicity cannot pass
        run: ./jbang tests/ValidationPlanTest.java
      - name: Scoped and full reactor findings agree
        run: ./jbang tests/ValidationOptimizationTest.java . "${{ runner.temp }}/guardrails-m2"
      - name: Both modes preserve scope and same-version resume
        run: ./jbang tests/PassPolicyTest.java .
      - name: Only exact verified candidates can be accepted
        run: ./jbang tests/PassTransactionTest.java . "${{ runner.temp }}/guardrails-m2"
      - name: Compiler exceptions remain visible and cannot hide introduced findings
        run: ./jbang tests/CompilerExceptionTest.java . "${{ runner.temp }}/guardrails-m2"
      - name: Bytecode reports require complete reproducible evidence
        run: ./jbang tests/EvidenceCompletenessTest.java . "${{ runner.temp }}/guardrails-m2"
      - name: Configured PIT detects assertion regressions
        run: ./jbang tests/PitRegressionTest.java . "${{ runner.temp }}/guardrails-m2"
      - name: Configured Lincheck executes and catches lost updates
        run: ./jbang tests/LincheckRegressionTest.java . "${{ runner.temp }}/guardrails-m2"
      - name: Configured NullAway scope cannot silently shrink
        run: ./jbang tests/NullawayScopeTest.java . "${{ runner.temp }}/guardrails-m2"
      - name: A direct-goal plant cannot certify dormant lifecycle enforcement
        run: ./jbang tests/VerifyExecutionTest.java . "${{ runner.temp }}/guardrails-m2"
      - name: Cancellation stops owned measurement processes
        run: ./jbang tests/RunProcessTest.java
      - name: Reactor consumers use packaged test-jar contracts
        run: ./jbang tests/TestJarReactorTest.java . "${{ runner.temp }}/guardrails-m2"
      - name: SKILL.md validates against the Agent Skills spec
        run: npx -y skills-ref validate .
      - name: Manifests are valid JSON and point at the root
        run: |
          python3 -c "import json; m=json.load(open('.claude-plugin/marketplace.json')); assert m['plugins'][0]['source']=='.'; json.load(open('.claude-plugin/plugin.json'))"
